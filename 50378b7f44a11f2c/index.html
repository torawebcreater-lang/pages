<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ご提案資料</title>
<style>
:root, :root[data-theme="dark"], :root[data-theme="light"] {
  color-scheme: light;
  --ground: #ffffff; --surface: #ffffff; --ink: #0c1626; --ink-2: #33475b; --ink-3: #5a7183;
  --rule: #dce5ee; --rule-strong: #b6c6d6; --accent: #0b5ed7; --accent-soft: #e8f1fd; --warn: #b8431f;
  --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background: var(--ground); color: var(--ink); font-family: var(--sans); line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}
.gate {
  width: 100%; max-width: 420px; background: var(--surface);
  border: 1px solid var(--rule); border-radius: 3px; padding: 34px 32px;
}
.kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; color: var(--accent); margin-bottom: 12px; }
h1 { font-family: var(--serif); font-weight: 600; font-size: 23px; line-height: 1.45; margin: 0 0 10px; }
p.sub { font-size: 13px; color: var(--ink-2); margin: 0 0 24px; }
label { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3); margin-bottom: 7px; }
input {
  width: 100%; font-family: var(--mono); font-size: 15px; padding: 11px 13px;
  border: 1px solid var(--rule-strong); border-radius: 2px;
  background: var(--ground); color: var(--ink);
}
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
button {
  margin-top: 14px; width: 100%; font-family: var(--sans); font-size: 14px; letter-spacing: .04em;
  padding: 11px; border-radius: 2px; border: 1px solid var(--accent);
  background: var(--accent); color: #fff; cursor: pointer;
}
button:disabled { opacity: .55; cursor: default; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.msg { min-height: 20px; margin-top: 12px; font-size: 12.5px; color: var(--warn); }
.msg.working { color: var(--ink-3); }
.foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink-3); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="gate">
  <div class="kicker">CONFIDENTIAL</div>
  <h1>ご提案資料</h1>
  <p class="sub">閲覧にはパスワードが必要です。本文は暗号化して保管されています。</p>
  <form id="f" autocomplete="off">
    <label for="pw">パスワード</label>
    <input id="pw" type="password" autocomplete="current-password" spellcheck="false" autofocus>
    <button id="go" type="submit">開く</button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="foot">第三者への転送・共有はお控えください。</div>
</main>

  var f = document.getElementById("f");
  var pw = document.getElementById("pw");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");

  function bytes(b64s) {
    var bin = atob(b64s), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }

  f.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!pw.value) return;
    go.disabled = true;
    msg.className = "msg working";
    msg.textContent = "復号しています";
    try {
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.value), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: bytes(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
      var buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(DATA.iv) }, key, bytes(DATA.ct));
      var html = new TextDecoder().decode(buf);
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      go.disabled = false;
      msg.className = "msg";
      msg.textContent = "パスワードが違います";
      pw.select();
    }
  });
